<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaneTrust AI</title>
<style>
  :root {
    --um-green: #005030;
    --um-green-dark: #003d25;
    --um-orange: #f47321;
    --um-orange-dark: #d85f12;
    --ink: #1a1a1a;
    --muted: #5f6b66;
    --line: #dfe5e2;
    --bg: #f4f7f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--um-green) 0%, var(--um-green-dark) 100%);
    color: #fff;
    padding: 48px 16px 72px;
    text-align: center;
    border-bottom: 5px solid var(--um-orange);
  }
  header h1 { margin: 0; font-size: 2rem; letter-spacing: .5px; }
  header h1 span { color: var(--um-orange); }
  header p { margin: 10px auto 0; max-width: 460px; color: #cfe3d8; line-height: 1.5; }

  main { max-width: 520px; margin: -40px auto 48px; padding: 0 16px; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0, 48, 30, .12);
    border: 1px solid var(--line);
  }
  label { display: block; margin: 18px 0 6px; font-weight: 600; font-size: .85rem; color: var(--um-green); }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input:not([type]) {
    width: 100%; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 8px; background: #fbfdfc;
    transition: border-color .15s, box-shadow .15s;
  }
  select {
    width: 100%; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 8px; background: #fbfdfc;
    transition: border-color .15s, box-shadow .15s;
  }
  select:focus, input:focus {
    outline: none; border-color: var(--um-orange);
    box-shadow: 0 0 0 3px rgba(244, 115, 33, .2);
  }
  input[type="file"] {
    width: 100%; padding: 18px 12px; font-size: .95rem;
    border: 2px dashed var(--um-green); border-radius: 10px;
    background: #f1f8f4; color: var(--muted); cursor: pointer;
  }
  input[type="file"]::file-selector-button {
    margin-right: 12px; padding: 8px 14px; border: 0; border-radius: 6px;
    background: var(--um-green); color: #fff; font-weight: 600; cursor: pointer;
  }
  input[type="file"]::file-selector-button:hover { background: var(--um-green-dark); }

  button[type="submit"] {
    width: 100%; margin-top: 24px; padding: 13px 18px;
    background: var(--um-orange); color: #fff; font-size: 1rem; font-weight: 700;
    border: 0; border-radius: 8px; cursor: pointer;
    transition: background .15s, transform .05s;
  }
  button[type="submit"]:hover { background: var(--um-orange-dark); }
  button[type="submit"]:active { transform: translateY(1px); }
  button[type="submit"]:disabled { opacity: .55; cursor: wait; }

  #msg { margin-top: 16px; min-height: 1.4em; font-size: .92rem; color: var(--muted); text-align: center; }
  #msg.ok { color: var(--um-green); font-weight: 600; }
  #msg.err { color: #b3261e; }

  footer { text-align: center; color: var(--muted); font-size: .8rem; padding-bottom: 32px; }
</style>
</head>
<body>
  <header>
    <h1>Cane<span>Trust</span> AI</h1>
    <p>Upload a trust or amendment PDF. You'll get a filled annotation spreadsheet to review.</p>
  </header>

  <main>
    <div class="card">
      <form id="form">
        <label for="file">Trust document (PDF)</label>
        <input id="file" name="file" type="file" accept=".pdf" required>

        <label for="label">Document label</label>
        <select id="label" name="label">
          <option value="Trust document" selected>Trust document</option>
          <option value="Amendment">Amendment</option>
        </select>

        <label for="status">Legal status</label>
        <input id="status" name="status" value="OPERATIVE">

        <button type="submit">Generate annotation</button>
      </form>
      <div id="msg"></div>
    </div>
  </main>

  <footer>Miami AI &amp; Law Lab</footer>

<script>
const form = document.getElementById("form");
const msg = document.getElementById("msg");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = form.querySelector("button");
  btn.disabled = true;
  msg.className = "";
  msg.textContent = "Working on it. Long documents can take a few minutes.";
  try {
    const res = await fetch("/api/annotate", { method: "POST", body: new FormData(form) });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const name = (res.headers.get("Content-Disposition") || "").match(/filename="(.+)"/)?.[1] || "annotation.xlsx";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    msg.className = "ok";
    msg.textContent = "Done. Your download should start.";
  } catch (err) {
    msg.className = "err";
    msg.textContent = "Something went wrong: " + err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
